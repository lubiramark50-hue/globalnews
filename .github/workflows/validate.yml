name: Validate GlobalNews
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check public/app.js
          node --check functions/api/news.js
          node --check functions/api/location.js
          node --check functions/api/status.js
          node --check functions/api/search.js
          node --check 'functions/api/story/[id].js'
          node --check worker/ingest.js
          node --check public/app.js
      - name: Run regression tests
        run: node --experimental-default-type=module --test tests/*.mjs
      - name: Validate assets
        run: |
          test -s public/index.html
          test -s public/styles.css
          test -s sql/d1-schema.sql
