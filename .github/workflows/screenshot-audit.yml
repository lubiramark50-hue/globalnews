name: GlobalNews Full-Page Screenshot Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/screenshot-audit.mjs'
      - 'scripts/contact-sheets.py'
      - '.github/workflows/screenshot-audit.yml'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture all page layouts on Android and Windows
        run: node scripts/screenshot-audit.mjs
      - name: Build Android and Windows contact sheets
        if: always()
        run: |
          python -m pip install --quiet Pillow
          python scripts/contact-sheets.py
      - name: Save visual review contact sheets to repository
        if: always()
        run: |
          git config user.name "globalnews-qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git add docs/qa/globalnews-android-contact-sheet.jpg docs/qa/globalnews-windows-contact-sheet.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add current Android and Windows screenshot review sheets"
            git push origin HEAD:main
          fi
      - name: Upload screenshots and report even on test failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globalnews-full-page-audit
          path: screenshots/audit/
          retention-days: 14
